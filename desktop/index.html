<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0284c7" />
    <meta name="description" content="Cross-platform desktop application for Google Workspace (Gmail & Google Drive) backups" />
    <link rel="manifest" href="/manifest.json" />
    <title>Google Workspace Backup</title>
  </head>
  <body style="margin: 0; padding: 0; background-color: #090d16;">
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(err => {
            console.log('SW registration skipped:', err);
          });
        });
      }
    </script>
  </body>
</html>
